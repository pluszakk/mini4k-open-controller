name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Protocol library tests
        run: ./gradlew :duml:test --console=plain

      - name: Build APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini4k-usb-sniffer-apk
          path: app/build/outputs/apk/debug/*.apk

      # On main, publish the APK as the "latest" release so it can be downloaded on the phone.
      - name: Publish latest APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk mini4k-usb-sniffer.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest mini4k-usb-sniffer.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "USB Sniffer - najnowsza wersja" \
            --notes "Automatyczna wersja testowa zbudowana z $GITHUB_SHA."
